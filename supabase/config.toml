project_id = "align-web-mvp"

[auth]
enabled = true
site_url = "https://app.alignflow.xyz"
additional_redirect_urls = [
  "https://app.alignflow.xyz/auth/callback",
  "https://align-web-mvp.vercel.app/auth/callback",
  "https://alignflow.xyz/auth/callback",
  "https://www.alignflow.xyz",
  "http://localhost:3000/auth/callback",
]
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "admin@example.com"
sender_name = "AlignFlow"
